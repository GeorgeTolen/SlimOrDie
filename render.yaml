services:
  - type: web
    name: pohuday-ili-umri
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /app/data/game.db
    disk:
      name: game-data
      mountPath: /app/data
      sizeGB: 1
