app = "pohuday-ili-umri"
primary_region = "fra"

[build]

[env]
  PORT     = "8080"
  DB_PATH  = "/app/data/game.db"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval     = "15s"
    method       = "GET"
    path         = "/api/health"
    timeout      = "5s"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 256

[[mounts]]
  source       = "game_data"
  destination  = "/app/data"
  initial_size = "1gb"
